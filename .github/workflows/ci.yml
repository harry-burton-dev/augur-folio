name: CI
# Every pull request: lint, typecheck, test and build, in one job (a few minutes), and the app's contract-3
# files checked: the manifest, each part's Score file and the release file they make (`pnpm check:app`).
# Images are built only by the release, dev build and preview workflows.
on:
  pull_request:
  workflow_dispatch:
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true
permissions:
  contents: write # only to commit a missing pnpm-lock.yaml back to the pull request
  packages: read
jobs:
  check:
    runs-on: ubuntu-latest
    # The store's tests run on Postgres, the image deployments use; it starts with the job, so it costs seconds.
    services:
      postgres:
        image: pgvector/pgvector:0.8.0-pg16
        env:
          POSTGRES_USER: folio
          POSTGRES_PASSWORD: folio-ci-only
          POSTGRES_DB: folio
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U folio"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      # The token secrets can carry a line ending from how they were pasted; pnpm then rejects the header.
      - name: Package token
        env:
          PACKAGES_TOKEN: ${{ secrets.PACKAGES_READ_TOKEN || github.token }}
        run: |
          t=$(printf %s "$PACKAGES_TOKEN" | tr -d '\r\n' | sed 's/^\xef\xbb\xbf//')
          echo "::add-mask::$t"
          echo "NODE_AUTH_TOKEN=$t" >> "$GITHUB_ENV"
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref || github.ref }}
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: ${{ hashFiles('pnpm-lock.yaml') != '' && 'pnpm' || '' }}
      - name: Install
        run: |
          if [ -f pnpm-lock.yaml ]; then pnpm install --frozen-lockfile; else pnpm install; fi
      - name: Commit the lockfile, the first time
        if: hashFiles('pnpm-lock.yaml') != '' && github.event_name == 'pull_request'
        run: |
          if [ -n "$(git status --porcelain pnpm-lock.yaml)" ]; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add pnpm-lock.yaml && git commit -m "Add pnpm-lock.yaml" && git push
          fi
      - run: pnpm lint
      - run: pnpm check:catalog
      - run: pnpm check:app
      - run: pnpm typecheck
      # Poppler, which the worker part's reader copies use; the image has it too (Dockerfile).
      - run: sudo apt-get update -qq && sudo apt-get install -y -qq --no-install-recommends poppler-utils
      - run: pnpm test
        env:
          DATABASE_URL: postgres://folio:folio-ci-only@localhost:5432/folio
      - run: pnpm build
