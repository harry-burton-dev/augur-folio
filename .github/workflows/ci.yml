name: CI
# Every pull request: lint, typecheck, test and build, in one job (a few minutes). Images are built only
# by the release, dev build and preview workflows.
on:
  pull_request:
  workflow_dispatch:
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true
permissions:
  contents: write # only to commit a missing pnpm-lock.yaml back to the pull request
  packages: read
jobs:
  check:
    runs-on: ubuntu-latest
    # The store's Postgres tests run here too, against the same image deployments use (pgvector, with
    # pg_trgm); without DATABASE_URL they skip. The service starts with the job, so it costs seconds.
    services:
      postgres:
        image: pgvector/pgvector:0.8.0-pg16
        env:
          POSTGRES_USER: platform
          POSTGRES_PASSWORD: platform-ci-only
          POSTGRES_DB: platform
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U platform"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      # The token secrets can carry a line ending from how they were pasted; pnpm then rejects the header.
      - name: Package token
        env:
          PACKAGES_TOKEN: ${{ secrets.PACKAGES_READ_TOKEN || github.token }}
        run: |
          t=$(printf %s "$PACKAGES_TOKEN" | tr -d '\r\n' | sed 's/^\xef\xbb\xbf//')
          echo "::add-mask::$t"
          echo "NODE_AUTH_TOKEN=$t" >> "$GITHUB_ENV"
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref || github.ref }}
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: ${{ hashFiles('pnpm-lock.yaml') != '' && 'pnpm' || '' }}
      - name: Install
        run: |
          if [ -f pnpm-lock.yaml ]; then pnpm install --frozen-lockfile; else pnpm install; fi
      - name: Commit the lockfile, the first time
        if: hashFiles('pnpm-lock.yaml') != '' && github.event_name == 'pull_request'
        run: |
          if [ -n "$(git status --porcelain pnpm-lock.yaml)" ]; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add pnpm-lock.yaml && git commit -m "Add pnpm-lock.yaml" && git push
          fi
      - run: pnpm lint
      - run: pnpm check:catalog
      - run: pnpm typecheck
      - run: pnpm test
        env:
          DATABASE_URL: postgres://platform:platform-ci-only@localhost:5432/platform
      - run: pnpm build

  # The rendition worker, in Python: its tests against a real Postgres with Artifacts' schema, PDFs
  # included (Docling fetches its models once; they're cached), and its image.
  # Only when the worker or the schema it reads (the service) changed: it installs Torch and Docling.
  worker-changed:
    runs-on: ubuntu-latest
    outputs:
      worker: ${{ steps.diff.outputs.worker }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - id: diff
        run: |
          base="${{ github.event.pull_request.base.sha || 'HEAD~1' }}"
          if git diff --quiet "$base" HEAD -- worker service .github/workflows/ci.yml; then echo worker=false; else echo worker=true; fi >> "$GITHUB_OUTPUT"
  worker:
    needs: worker-changed
    if: needs.worker-changed.outputs.worker == 'true'
    runs-on: ubuntu-24.04
    services:
      postgres:
        image: pgvector/pgvector:0.8.0-pg17
        env:
          POSTGRES_USER: platform
          POSTGRES_PASSWORD: platform-ci-only
          POSTGRES_DB: platform
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U platform"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgres://platform:platform-ci-only@localhost:5432/platform
    steps:
      # The token secrets can carry a line ending from how they were pasted; pnpm then rejects the header.
      - name: Package token
        env:
          PACKAGES_TOKEN: ${{ secrets.PACKAGES_READ_TOKEN || github.token }}
        run: |
          t=$(printf %s "$PACKAGES_TOKEN" | tr -d '\r\n' | sed 's/^\xef\xbb\xbf//')
          echo "::add-mask::$t"
          echo "NODE_AUTH_TOKEN=$t" >> "$GITHUB_ENV"
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
      - name: Install
        run: |
          if [ -f pnpm-lock.yaml ]; then pnpm install --frozen-lockfile; else pnpm install; fi
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: worker/requirements.lock
      # The lock holds pyproject.toml's pins; then exactly what the image installs (Torch's CPU-only build).
      - run: worker/lock.sh check
      - run: |
          pip install --require-hashes -r worker/requirements.lock
          pip install --no-deps -e worker
          pip install "$(python3 -c 'import tomllib; print(tomllib.load(open("worker/pyproject.toml","rb"))["project"]["optional-dependencies"]["test"][0])')"
      # Known vulnerabilities in the worker's packages, listed in the summary. Only ones this change brings
      # in fail it; the base branch's are for the next dependency update.
      - name: No new Python packages with known vulnerabilities (OSV-Scanner)
        run: |
          ids() { jq -r '[.results[]?.packages[]? | .package as $p | .vulnerabilities[]? | "\($p.name)@\($p.version) \(.id)"] | unique | .[]'; }
          osv() { docker run --rm -v "$1:/src:ro" -w /src ghcr.io/google/osv-scanner:v2.0.2 scan source -L requirements.txt:requirements.lock --format json 2>/dev/null || true; }
          mkdir -p "$RUNNER_TEMP/base"
          osv "$PWD/worker" > "$RUNNER_TEMP/now.json"
          jq -e '.results' "$RUNNER_TEMP/now.json" > /dev/null
          ids < "$RUNNER_TEMP/now.json" > "$RUNNER_TEMP/now.txt"
          { echo "### Known vulnerabilities in the worker's packages: $(wc -l < "$RUNNER_TEMP/now.txt")"; sed 's/^/- /' "$RUNNER_TEMP/now.txt"; } >> "$GITHUB_STEP_SUMMARY"
          # Only a pull request has a base to compare with; on a push the summary is the record.
          [ -n "$BASE_REF" ] || exit 0
          git fetch -q --depth=1 origin "$BASE_REF"
          if ! git show "origin/$BASE_REF:worker/requirements.lock" > "$RUNNER_TEMP/base/requirements.lock" 2>/dev/null; then
            echo "$BASE_REF has no lock yet: nothing to compare with."
            exit 0
          fi
          osv "$RUNNER_TEMP/base" > "$RUNNER_TEMP/before.json"
          jq -e '.results' "$RUNNER_TEMP/before.json" > /dev/null
          ids < "$RUNNER_TEMP/before.json" > "$RUNNER_TEMP/before.txt"
          new=$(comm -23 <(sort "$RUNNER_TEMP/now.txt") <(sort "$RUNNER_TEMP/before.txt"))
          if [ -n "$new" ]; then echo "This change brings in:"; echo "$new"; exit 1; fi
          echo "Nothing new: $(wc -l < "$RUNNER_TEMP/now.txt") known, all already on the base branch."
        env:
          BASE_REF: ${{ github.base_ref }}
      - uses: actions/cache@v4
        with:
          path: ~/.cache/huggingface
          key: docling-models-${{ hashFiles('worker/requirements.lock') }}
      # The worker works on the tables the service makes.
      - run: pnpm --filter @apps/folio migrate
      - run: python -m pytest worker -v
        env:
          RUN_PDF_TESTS: "1"
      - name: The worker's image builds, holds its models and doesn't run as root
        run: |
          docker build -f worker/Dockerfile -t folio-worker .
          test "$(docker run --rm folio-worker id -u)" != 0
          docker run --rm folio-worker python -c "from folio_worker.render import ENGINE_VERSION; print(ENGINE_VERSION)"
          test -n "$(docker run --rm folio-worker sh -c 'ls "$DOCLING_ARTIFACTS_PATH"')"
